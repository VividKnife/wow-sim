services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wow_sim
      POSTGRES_USER: wow_sim
      POSTGRES_PASSWORD: wow_sim_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wow_sim_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow_sim -d wow_sim"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wow_sim_postgres:
