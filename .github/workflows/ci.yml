name: Validate and deploy
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**', '!codex/zeabur-deploy']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-and-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_ASSET_MODE: ${{ vars.WEB_ASSET_MODE || 'r2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: npm run ci:validate
        env:
          WEB_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
          include-hidden-files: true
  publish-r2-assets:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.WEB_ASSET_MODE != 'bundled'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: r2-production-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
      - run: node scripts/publish-r2-assets.mjs --upload
        env:
          R2_ACCOUNT_ID: d4516749783eedab5aabf13adf1d9527
          R2_BUCKET: wow-sim
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: uploaded-web-build
          path: apps/web/dist
          include-hidden-files: true
  publish-deployment:
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && (needs.publish-r2-assets.result == 'success' || (vars.WEB_ASSET_MODE == 'bundled' && needs.publish-r2-assets.result == 'skipped'))
    needs: [validate, publish-r2-assets]
    env:
      WEB_ASSET_MODE: ${{ vars.WEB_ASSET_MODE || 'r2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: zeabur-production-source
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ vars.WEB_ASSET_MODE == 'bundled' && 'web-build' || 'uploaded-web-build' }}
          path: apps/web/dist
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/publish-zeabur.mjs --publish
  verify-deployment:
    needs: publish-deployment
    if: always() && needs.publish-deployment.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
      - name: Wait for the deployed build and verify public endpoints
        run: node scripts/verify-deployment.mjs
