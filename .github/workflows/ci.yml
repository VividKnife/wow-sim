name: Validate and deploy
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**', '!codex/zeabur-deploy']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WEB_ASSET_MODE: ${{ vars.WEB_ASSET_MODE || 'r2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Validate asset deployment mode
        run: node -e "if (!['r2', 'bundled'].includes(process.env.WEB_ASSET_MODE)) throw new Error('WEB_ASSET_MODE must be r2 or bundled')"
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: npm run data:check
      - run: node --test scripts/publish-zeabur.test.mjs scripts/publish-r2-assets.test.mjs scripts/verify-deployment.test.mjs apps/web/test/static-web.test.mjs
      - run: npm run content:measure
      - run: node --test apps/web/test/content-packs.test.mjs apps/web/test/client-snapshot.test.mjs
      - run: node --test apps/web/test/game-response.test.mjs packages/sim-core/test/collections.test.mjs
      - run: node --test packages/sim-core/test/packed-content.test.mjs packages/game-domain/test/runtime-content.test.mjs
      - run: node --test scripts/game-runtime.test.mjs
      - run: npm run simulation:test
      - run: npm run typecheck
      - run: node --test apps/web/test/route-performance.test.mjs apps/web/test/mounts.test.mjs apps/web/test/navigation.test.mjs apps/web/test/snapshot-poller.test.mjs packages/game-domain/test/mounts-service.test.ts
      - run: node --test --test-concurrency=2 apps/web/test/account-store.test.ts apps/game-server/test/*.test.ts apps/game-worker/test/*.test.ts
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
      - run: node scripts/verify-web-build.mjs
      - name: Install browser for production smoke test
        if: env.WEB_ASSET_MODE == 'r2'
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Verify CDN modules and server-authoritative gameplay in browser
        if: env.WEB_ASSET_MODE == 'r2'
        run: node apps/web/scripts/verify-browser.mjs
        env:
          WEB_QA_OUTPUT: ${{ runner.temp }}/wow-vite-qa
      - name: Save browser evidence
        if: always() && env.WEB_ASSET_MODE == 'r2'
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/wow-vite-qa
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
          include-hidden-files: true
      - run: docker build -f Dockerfile.runtime -t wow-sim-runtime:ci .
      - run: node scripts/verify-production.mjs
        env:
          RUNTIME_IMAGE: wow-sim-runtime:ci
      - run: docker build -t wow-sim-web:ci .
  publish-r2-assets:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.WEB_ASSET_MODE != 'bundled'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: r2-production-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
      - run: node scripts/publish-r2-assets.mjs --upload
        env:
          R2_ACCOUNT_ID: d4516749783eedab5aabf13adf1d9527
          R2_BUCKET: wow-sim
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: uploaded-web-build
          path: apps/web/dist
          include-hidden-files: true
  publish-deployment:
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && (needs.publish-r2-assets.result == 'success' || (vars.WEB_ASSET_MODE == 'bundled' && needs.publish-r2-assets.result == 'skipped'))
    needs: [validate, publish-r2-assets]
    env:
      WEB_ASSET_MODE: ${{ vars.WEB_ASSET_MODE || 'r2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: zeabur-production-source
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ vars.WEB_ASSET_MODE == 'bundled' && 'web-build' || 'uploaded-web-build' }}
          path: apps/web/dist
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/publish-zeabur.mjs --publish
  verify-deployment:
    needs: publish-deployment
    if: always() && needs.publish-deployment.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
      - name: Wait for the deployed build and verify public endpoints
        run: node scripts/verify-deployment.mjs
